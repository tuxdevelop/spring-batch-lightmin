/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
    id 'java-test-fixtures'
}

dependencies {
    api project(':spring-batch-lightmin-client-core')
    api project(':spring-batch-lightmin-metrics')
    compileOnly libs.org.springframework.boot.spring.boot.configuration.processor
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'junit:junit:4.13.2'
    testFixturesCompileOnly 'org.projectlombok:lombok:1.18.42'
    testFixturesAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}

sourceSets {
    testFixtures {
        java.srcDir 'src/test/java'
    }
}

description = 'spring-batch-lightmin-server-core'

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing.publications.maven.artifact(testsJar)
