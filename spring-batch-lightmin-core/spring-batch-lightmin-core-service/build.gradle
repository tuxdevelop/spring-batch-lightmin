plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.org.springframework.spring.web
    api libs.org.springframework.spring.webmvc
    api project(':spring-batch-lightmin-api')
    api project(':spring-batch-lightmin-core-batch')
    api project(':spring-batch-lightmin-core-configuration')
    api project(':spring-batch-lightmin-repository-core')
    api project(':spring-batch-lightmin-validation')
    api libs.org.springframework.boot.spring.boot.actuator
    api libs.org.springframework.boot.spring.boot.configuration.processor
    api libs.org.springframework.restdocs.spring.restdocs.core
    testImplementation project(':spring-batch-lightmin-repository-map')
    testImplementation project(':spring-batch-lightmin-test-domain')
    testImplementation project(':spring-batch-lightmin-test-api')
    testImplementation libs.org.springframework.boot.spring.boot.starter.web
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'com.h2database:h2'
}

description = 'spring-batch-lightmin-core-service'
