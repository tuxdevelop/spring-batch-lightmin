/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api libs.jakarta.persistence.jakarta.persistence.api
    api libs.org.springframework.spring.jdbc
    api libs.org.springframework.spring.orm
    api libs.org.springframework.batch.spring.batch.core
    implementation 'com.h2database:h2'
    api project(':spring-batch-lightmin-domain')
    api libs.org.springframework.boot.spring.boot.starter
    testImplementation project(':spring-batch-lightmin-repository-map')
    testImplementation project(':spring-batch-lightmin-test-domain')
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation libs.org.springframework.boot.spring.boot.starter.data.jpa
    compileOnly libs.org.springframework.boot.spring.boot.configuration.processor
}

description = 'spring-batch-lightmin-core-batch'
