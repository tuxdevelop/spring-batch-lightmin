        exclude(group: 'com.mchange', module: 'c3p0')

        // TODO: This exclude was sourced from a POM exclusion and is NOT exactly equivalent, see: https://docs.gradle.org/9.6.1/userguide/build_init_plugin.html#sec:pom_maven_conversion
        exclude(group: 'com.zaxxer', module: '*')
    }
    testImplementation project(':spring-batch-lightmin-repository-map')
    testImplementation project(':spring-batch-lightmin-test-domain')
    compileOnly libs.org.springframework.boot.spring.boot.configuration.processor
}

description = 'spring-batch-lightmin-core-configuration'
