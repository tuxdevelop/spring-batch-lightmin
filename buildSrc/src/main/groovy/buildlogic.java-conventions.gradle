/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    api enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    api platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.2')
    api 'org.springframework.boot:spring-boot-starter-logging'
    api 'org.springframework.batch:spring-batch-infrastructure:6.0.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit:4.13.2'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}

group = 'org.tuxdevelop'
version = '2.2.2-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
