/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':spring-batch-lightmin-client-classic')
    api project(':spring-batch-lightmin-core-starter')
    api project(':spring-batch-lightmin-repository-map')
    api project(':spring-batch-lightmin-server-standalone')
    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.springframework.restdocs.spring.restdocs.core
    api libs.org.springframework.restdocs.spring.restdocs.restassured
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

description = 'spring-batch-lightmin-documentation'

tasks.named('test') {
    useJUnitPlatform()
}
